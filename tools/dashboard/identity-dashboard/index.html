<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI-µ · Identity Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #01040a; }
    #root { height: 100%; }
  </style>
</head>
<body>
<div id="root"></div>

<!-- React 18 UMD (dev) -->
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

<!-- Babel standalone — transforms the TSX on load (dev/CDN mode) -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- The component (served by the PS HttpListener alongside this page) -->
<script type="text/babel" src="IdentityDashboard.tsx" data-presets="react,typescript"></script>

<!-- Mount -->
<script type="text/babel" data-presets="react,typescript">
  const params = new URLSearchParams(window.location.search);
  const runtimePort: string = params.get('runtime') ?? '9879';
  const root = ReactDOM.createRoot(document.getElementById('root')!);
  root.render(React.createElement(window.IdentityDashboard as any, { runtimePort }));
</script>
</body>
</html>
