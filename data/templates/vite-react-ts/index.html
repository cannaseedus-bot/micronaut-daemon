<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{app_name}}</title>
    <meta name="description" content="{{description}}" />
    <style>:root { --brand: {{brand_color}}; --brand-dark: {{brand_dark}}; }</style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const { useState } = React;

      function DarkModeToggle({ dark, onToggle }) {
        return (
          <button
            onClick={onToggle}
            className="text-sm font-medium px-3 py-1 rounded border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
          >
            {dark ? '☀ Light' : '☾ Dark'}
          </button>
        );
      }

      function App() {
        const [dark, setDark] = useState(false);
        return (
          <div className={dark ? 'dark' : ''}>
            <div className="min-h-screen transition-colors bg-white dark:bg-[var(--brand-dark)] text-gray-900 dark:text-gray-100">
              <header className="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-700">
                <h1 className="text-xl font-bold" style={{ color: 'var(--brand)' }}>{{app_name}}</h1>
                <DarkModeToggle dark={dark} onToggle={() => setDark(d => !d)} />
              </header>
              <main className="p-6">
                <p className="text-gray-500 dark:text-gray-400">{{description}}</p>
              </main>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(
        <React.StrictMode><App /></React.StrictMode>
      );
    </script>
  </body>
</html>
