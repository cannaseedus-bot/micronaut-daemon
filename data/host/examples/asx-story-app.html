<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASX Story App</title>
<style>
:root{color-scheme:dark;--coal:#090b0d;--panel:#14171a;--paper:#eee8d5;--ink:#161616;--bone:#eee9db;--muted:#aaa69b;--red:#e64631;--gold:#d6aa43;--line:#3a3c3d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#35140e 0,transparent 32%),linear-gradient(145deg,#090b0d,#17120f);color:var(--bone);font:16px/1.5 ui-sans-serif,system-ui,sans-serif}.shell{width:min(1160px,calc(100% - 28px));margin:auto;padding:24px 0 48px}.mast{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:18px}.kicker,.act{text-transform:uppercase;letter-spacing:.16em;font-weight:900;font-size:.72rem;color:var(--red)}h1{font:900 clamp(2.3rem,7vw,5.8rem)/.9 Georgia,serif;letter-spacing:-.055em;margin:10px 0 4px}.subtitle{color:var(--muted);max-width:700px}.runtime{color:var(--gold);font-size:.82rem}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.stat{background:rgba(20,23,26,.92);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.stat span{display:block;color:var(--muted);text-transform:uppercase;font-size:.68rem;letter-spacing:.12em}.stat b{font-size:1.55rem}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(270px,.55fr);gap:14px}.brief{background:var(--paper);color:var(--ink);border-radius:16px;padding:28px;min-height:310px}.brief h2{font:800 clamp(1.8rem,4vw,3.2rem)/1 Georgia,serif;margin:18px 0}.brief p{font-size:1.05rem}.witness{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;justify-content:space-between}.sigil{font-size:5rem;text-align:center;filter:drop-shadow(0 10px 18px #000)}.doctrine{font-family:Georgia,serif;font-size:1.15rem;border-top:1px solid var(--line);padding-top:16px}.choices{margin-top:14px;background:rgba(20,23,26,.95);border:1px solid var(--line);border-radius:16px;padding:20px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.choice{appearance:none;background:#0d1012;color:var(--bone);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;cursor:pointer}.choice:hover,.choice:focus-visible{border-color:var(--gold);outline:0;transform:translateY(-2px)}.choice strong,.choice small{display:block}.choice small{color:var(--muted);margin-top:6px}.status{min-height:24px;color:var(--gold);margin-top:10px;font-size:.85rem}.verdict{display:none;margin-top:14px;border:1px solid var(--red);background:#1b1110;border-radius:16px;padding:24px}.verdict.active{display:block}.verdict h2{font:800 2.2rem Georgia,serif;margin:.2em 0}.ledger li{margin:.45em 0}.bar{height:4px;background:var(--line);margin-top:9px;overflow:hidden;border-radius:3px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));width:0}.toolbar{margin-top:14px}.quiet{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.choice-grid{grid-template-columns:1fr}.mast{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<main class="shell" id="app-root">
  <header class="mast"><div><div class="kicker">ASX · KHANARY Story Runtime</div><h1 id="title">Loading…</h1><div class="subtitle" id="subtitle"></div></div><div class="runtime" id="runtime">Loading app contract</div></header>
  <section class="stats" id="stats"></section>
  <section class="grid">
    <article class="brief"><div class="act" id="act"></div><h2 id="scene-title"></h2><p id="scene-text"></p></article>
    <aside class="witness"><div class="sigil" id="sigil">⚖️</div><div class="doctrine" id="doctrine">Evidence is preserved. Authority is not implied.</div></aside>
  </section>
  <section class="choices" id="choice-panel"><div class="kicker">Your move</div><div class="choice-grid" id="choice-list"></div><div class="status" id="status" aria-live="polite"></div></section>
  <section class="verdict" id="verdict"><div class="kicker">Independent review</div><h2 id="verdict-title"></h2><p id="index-result"></p><ol class="ledger" id="ledger"></ol><p>“No. That is what you wanted us to become.”</p></section>
  <div class="toolbar"><button class="quiet" id="restart">Restart</button> <button class="quiet" id="fullscreen">Fullscreen (F)</button></div>
</main>
<script>
(()=>{'use strict';
const APPS={kingdom:{file:'pig-kingdom.asx-app.json',index:'double_standard',log:'evidence_log',sigil:'🦋'},war:{file:'war-pigs.asx-app.json',index:'war_pig_index',log:'evidence_log',sigil:'⚖️'}};
const selected=new URLSearchParams(location.search).get('app')||'war';const config=APPS[selected]||APPS.war;
const APP='../apps/'+config.file,API='http://127.0.0.1:17885/api/program/POST';let manifest,state,base,pulse=0;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const data=manifest['@data'],scene=data.SCENES[state.scene],labels=data.STAT_LABELS;$('title').textContent=manifest['@title'];$('subtitle').textContent=manifest['@subtitle'];$('sigil').textContent=config.sigil;$('stats').innerHTML=Object.entries(labels).map(([key,label])=>`<div class="stat"><span>${esc(label)}</span><b>${Number(state[key])}</b><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(state[key])))}%"></i></div></div>`).join('');$('act').textContent=scene?.act||state.act;if(scene){$('scene-title').textContent=scene.title;$('scene-text').textContent=scene.text;$('choice-panel').hidden=false;$('verdict').classList.remove('active');$('choice-list').innerHTML=scene.choices.map(choice=>`<button class="choice" data-choice="${esc(choice.id)}"><strong>${esc(choice.label)}</strong><small>${esc(choice.detail)}</small></button>`).join('')}else{$('scene-title').textContent='The authority is yours. The test is whether you limit it.';$('scene-text').textContent='The review compares the rule you demanded from former rulers with the rule you accepted for yourself and your allies.';$('choice-panel').hidden=true;$('verdict-title').textContent=data.ROUTES[state.scene]||'Verdict';const score=Number(state[config.index]);const result=score<=0?'Equal rules survived the transfer of power.':score<15?'Exceptions weakened the principle.':score<30?'Emergency power became a new hierarchy.':'The investigator became the next War Pig.';$('index-result').innerHTML=`<strong>${selected==='war'?'War Pig Index':'Double-Standard Index'}: ${score}</strong> · ${esc(result)}`;$('ledger').innerHTML=state[config.log].map(row=>`<li>${esc(row)}</li>`).join('');$('verdict').classList.add('active')}}
async function choose(choice){$('status').textContent='Projecting through KHANARY…';const values={...choice.effects,record:choice.record,next:choice.next,act:choice.act};const body={'@kind':'semantic.json-program.v1','@route':'json.app','@verb':'POST','@operation':'call','@authority':'observation_only','@path':'data/host/apps/'+config.file,'@event':'choice.select','@values':values,'@state':state};try{const response=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(!response.ok)throw Error('HTTP '+response.status);const output=await response.json();if(output.error||!output.result)throw Error(output.error||'missing result');for(const key of Object.keys(base))if(Object.hasOwn(output.result,key))state[key]=output.result[key];$('runtime').textContent='KHANARY :17885 connected';$('status').textContent='Projection accepted · request-scoped · no promotion'}catch(error){for(const [key,value] of Object.entries(choice.effects))state[key]=Number(state[key])+Number(value);state[config.log]=[...state[config.log],choice.record];state.scene=choice.next;state.act=choice.act;$('runtime').textContent='Standalone projection';$('status').textContent='Local fallback · '+error.message}render()}
async function boot(){manifest=await fetch(APP).then(r=>{if(!r.ok)throw Error('manifest '+r.status);return r.json()});base=structuredClone(manifest['@state']);state=structuredClone(base);const query=new URLSearchParams(location.search),requestedScene=query.get('scene');if(requestedScene&&manifest['@data'].SCENES[requestedScene])state.scene=requestedScene;if(query.has('act'))state.act=query.get('act');if(query.has('index'))state[config.index]=Number(query.get('index'))||0;$('runtime').textContent='ASX mini-app loaded';render()}
document.addEventListener('click',event=>{const target=event.target.closest('[data-choice]');if(target){const scene=manifest['@data'].SCENES[state.scene];choose(scene.choices.find(x=>x.id===target.dataset.choice))}});$('restart').onclick=()=>{state=structuredClone(base);$('status').textContent='';render()};$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',event=>{if(event.key.toLowerCase()==='f')$('fullscreen').click()});window.advanceTime=ms=>{pulse=Math.sin(ms/240);document.documentElement.style.setProperty('--pulse',String(pulse))};window.render_game_to_text=()=>{const scene=manifest?.['@data'].SCENES[state?.scene],mode=scene?'choice':'verdict';const publicState={};for(const key of Object.keys(manifest?.['@data'].STAT_LABELS||{}))publicState[key]=state[key];Object.assign(publicState,{scene:state.scene,act:state.act,turn:state.turn});if(mode==='verdict'){publicState[config.index]=state[config.index];publicState.evidence_log=state[config.log]}return JSON.stringify({coordinate_system:'DOM layout; origin top-left, +x right, +y down',app:manifest?.['@id'],mode,state:publicState,visible_choices:scene?scene.choices.map(x=>x.id):[],runtime:$('runtime').textContent})};boot().catch(error=>{$('runtime').textContent='Load failed';$('scene-text').textContent=error.message});
})();
</script>
</body>
</html>
