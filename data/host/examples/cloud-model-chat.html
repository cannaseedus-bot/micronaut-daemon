<!doctype html>
<meta charset="utf-8">
<title>CloudModel · ASX Mini-App</title>
<style>
  :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
  body { margin:0; background:#171717; color:#ececf1; }
  main { max-width:850px; height:700px; margin:24px auto; background:#212121; border:1px solid #3d3d3d; border-radius:16px; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; background:#171717; border-bottom:1px solid #3d3d3d; }
  h1 { margin:0; font-size:1.2rem; color:#10a37f; }
  .controls { display:flex; gap:10px; }
  select, button, input { border:1px solid #3d3d3d; border-radius:8px; padding:8px 12px; font:inherit; }
  select, input { background:#2f2f2f; color:#ececf1; }
  button { background:#10a37f; color:#fff; cursor:pointer; font-weight:700; }
  .messages { flex:1; overflow:auto; padding:20px; }
  .message { display:flex; gap:12px; max-width:90%; margin:0 0 24px; }
  .message.user { margin-left:auto; flex-direction:row-reverse; }
  .avatar { width:36px; height:36px; border-radius:8px; display:grid; place-items:center; background:#10a37f; }
  .user .avatar { background:#5436da; }
  .bubble { background:#2f2f2f; padding:12px 16px; border-radius:12px; line-height:1.6; white-space:pre-wrap; }
  .user .bubble { background:#5436da; }
  .composer { padding:16px 20px; border-top:1px solid #3d3d3d; }
  form { display:flex; gap:10px; } form input { flex:1; border-radius:12px; }
  .disclaimer { text-align:center; color:#8e8ea0; font-size:.7rem; margin-top:8px; }
</style>
<main data-asx-key="⟁APP:CLOUD_MODEL_CHAT/⟁ROOT:CLOUD_MODEL_CHAT">
  <header data-asx-key="⟁APP:CLOUD_MODEL_CHAT/⟁WIDGET:HEADER">
    <h1>☁ CloudModel</h1>
    <div class="controls">
      <select data-asx-key="⟁APP:CLOUD_MODEL_CHAT/⟁SELECT:MODEL" data-asx-event="model.change"><option>qwen3-1.7b-chat</option></select>
      <button data-asx-key="⟁APP:CLOUD_MODEL_CHAT/⟁ACTION:CLEAR" data-asx-event="chat.clear">Clear</button>
    </div>
  </header>
  <section class="messages" data-asx-key="⟁APP:CLOUD_MODEL_CHAT/⟁WIDGET:MESSAGES">
    <div class="message" data-asx-key="⟁APP:CLOUD_MODEL_CHAT/⟁WIDGET:MESSAGE"><div class="avatar">☁</div><div class="bubble">How can I help you today?</div></div>
  </section>
  <footer class="composer" data-asx-key="⟁APP:CLOUD_MODEL_CHAT/⟁WIDGET:INPUT">
    <form data-asx-event="chat.send"><input placeholder="Message CloudModel…"><button type="submit">Send</button></form>
    <div class="disclaimer">Model output is a generated finding; verify important information.</div>
  </footer>
</main>
<script type="application/json" id="asx-json-runtime">
{
  "@kind":"asx.key-runtime.binding.v1",
  "@app":"⟁APP:CLOUD_MODEL_CHAT",
  "@manifest":"data/host/apps/cloud-model-chat.asx-app.json",
  "@executor":"mx.run",
  "@route":"model.chat",
  "@endpoint":"http://127.0.0.1:17885/v1/chat/completions",
  "@authority":"observation_only",
  "@state":"request_scoped",
  "@semantic_commit":false,
  "@events":{"model.change":"cloud.select_model","chat.clear":"cloud.clear","chat.send":"cloud.send","chat.receive":"cloud.receive"}
}
</script>
