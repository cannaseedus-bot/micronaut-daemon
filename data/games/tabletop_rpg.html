<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Ashen Vale — Phase RPG</title>
  <style>
    :root{color-scheme:dark;font-family:"Segoe UI",system-ui,sans-serif;background:#10141c;color:#e9f0f7}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 16% 10%,#55326c 0,transparent 35%),radial-gradient(ellipse at 86% 88%,#174659 0,transparent 38%),linear-gradient(145deg,#111622,#0b1018 70%)}
    main{width:min(100vw,1060px);padding:18px;border:1px solid #ffffff24;border-radius:20px;background:linear-gradient(135deg,#ffffff12,#ffffff04 48%,#8ecae610);box-shadow:0 30px 100px #0009,inset 0 1px #ffffff20;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
    header{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;color:#a9bacd;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
    header strong{color:#d7a9ff;text-shadow:0 0 14px #b278ff88}
    .stage{position:relative;width:100%;aspect-ratio:1000/680;border:1px solid #e1efff55;border-radius:14px;overflow:hidden;box-shadow:0 18px 55px #0008,inset 0 1px #ffffff40;background:linear-gradient(145deg,#171e2b,#121722)}
    .stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:manipulation}
    #game{z-index:0}#models{z-index:1;pointer-events:none}
    #hero-name{position:absolute;z-index:3;left:6.5%;top:23.1%;width:24%;height:5.4%;padding:0 12px;border:1px solid #c6e4ff66;border-radius:9px;background:#121c2bd9;color:#fff3d8;font:700 clamp(12px,1.4vw,17px) "Segoe UI",sans-serif;outline:none;box-shadow:inset 0 1px #ffffff22,0 0 20px #6ecbff12}
    #hero-name:focus{border-color:#89dcff;box-shadow:0 0 0 2px #64cfff33,0 0 24px #64cfff33}
    footer{margin:10px 2px 0;color:#b8c9df;font-size:11px;display:flex;justify-content:space-between;gap:12px;text-shadow:0 1px 8px #86c9ff44}
    @media(max-width:650px){main{padding:8px}header,footer{font-size:10px}}
  </style>
</head>
<body>
<main>
  <header><strong>THE ASHEN VALE</strong><span>Pop → Wo → Yax → Sek → Ch'en → Xul</span></header>
  <div class="stage"><canvas id="game" width="1000" height="680" aria-label="The Ashen Vale tabletop role-playing game"></canvas><canvas id="models" aria-hidden="true"></canvas><input id="hero-name" maxlength="18" value="Aria" aria-label="Hero name"></div>
    <footer><span>← ↑ ↓ → travel · 1 attack · 2 guard · 3 stealth · 4 salve · 5 flee · E store · I bag · C craft · Q spell · P poison · H food</span><span>F full · R hero</span></footer>
</main>
<script>
(() => {
  "use strict";
  const canvas=document.getElementById("game"),ctx=canvas.getContext("2d",{alpha:false});
  const W=canvas.width,H=canvas.height,PHASES=["Pop","Wo","Yax","Sek","Ch'en","Xul"];
  const buttons=[
    {id:"attack",label:"ATTACK",sub:"d20 + DEX vs AC",x:28,color:"#e1b55c"},
    {id:"defend",label:"DEFEND",sub:"+2 AC this round",x:221,color:"#72b9d8"},
    {id:"stealth",label:"STEALTH",sub:"DEX check · DC 14",x:414,color:"#c58bea"},
    {id:"potion",label:"SALVE",sub:"restore up to 6 HP",x:607,color:"#6bd39b"},
    {id:"flee",label:"FLEE",sub:"DEX check · DC 12",x:800,color:"#ed8b83"}
  ];
  let seed=0x41a5e77;
  const state={
    mode:"builder",phase:"Pop",phaseIndex:0,phaseElapsed:0,pending:null,turn:1,maxTurns:20,
    builder:{name:"Aria",heroClass:"Rogue",birthsign:"Veil",region:"CANYON",points:12,abilities:{str:2,dex:4,con:2,int:2,wis:1,cha:1},specialties:["Stealth","Lockpicking"],extras:["Healing Draught"]},
    player:{name:"Aria",class:"Rogue",level:3,hp:10,hpMax:10,ac:14,dex:16,str:12,con:14,int:10,wis:12,cha:15,potions:1,lives:3,xp:0,gold:0,score:0,inventory:[],defendBonus:0,alive:true,pos:{c:0,r:0}},
    enemy:{name:"Canyon Creep",hp:7,hpMax:7,ac:12,alive:true,pos:{c:0,r:0}},
    log:["A goblin guard blocks the corridor.","Choose an action to begin the turn cycle."],
    history:[],lastResolution:null,outcome:null,frame:0,effectTime:0,manualClock:false,map:null,mapSerial:0,loot:[],npc:null,npcTalked:false,inventoryOpen:false,overlay:""
  };
  const sceneSpecks=Array.from({length:54},(_,i)=>({x:(i*173+29)%W,y:170+(i*79)%280,r:1+(i%3)*.45}));
  const MAP={cols:64,rows:36,viewCols:18,viewRows:6,tile:44,left:104,top:207};
  const terrains={
    CANYON:{path:"sand trail",alt:"loose scree",wall:"cliff",obstacle:"boulder",props:["boulder","dead-tree","debris","wagon","ruin"]},
    FOREST:{path:"moss path",alt:"clearing",wall:"thicket",obstacle:"fallen log",props:["pine","pine","boulder","debris","wayfarer"]},
    RUINS:{path:"old road",alt:"rubble",wall:"stone wall",obstacle:"collapsed wall",props:["ruin","debris","cart","car","boulder","npc"]}
  };
  function buildMap(region,serial=0){
    let rs=0x7a31c4d9^(region==="FOREST"?0x3211:region==="RUINS"?0xa719:0x5103)^Math.imul(serial+1,0x45d9f3b);
    const rnd=n=>{rs^=rs<<13;rs^=rs>>>17;rs^=rs<<5;return (rs>>>0)%n;};
    const theme=terrains[region]||terrains.CANYON;
    const cells=Array.from({length:MAP.rows},()=>Array.from({length:MAP.cols},()=>({terrain:theme.wall,walkable:false,cost:99,prop:null})));
    const carved=[];let row=Math.floor(MAP.rows/2);
    const open=(c,r,alt=false)=>{if(c<0||c>=MAP.cols||r<0||r>=MAP.rows)return;const cell=cells[r][c];cell.terrain=alt?theme.alt:theme.path;cell.walkable=true;cell.cost=alt?1.35:1;cell.prop=null;carved.push({c,r});};
    open(0,row);
    for(let c=1;c<MAP.cols;c++){
      const shift= c===MAP.cols-1?0:(rnd(3)-1);let next=Math.max(1,Math.min(MAP.rows-2,row+shift));
      open(c-1,row);open(c,row);
      while(row!==next){row+=Math.sign(next-row);open(c,row);}
      // Side clearings create route choices. The terrain remains the constraint.
      for(const side of [-1,1])if(rnd(100)<34)open(c,row+side,true);
    }
    open(MAP.cols-1,row);
    // Scatter terrain blockers and named static scenery in cells that remain closed.
    const props=[];
    for(let r=0;r<MAP.rows;r++)for(let c=0;c<MAP.cols;c++){
      const cell=cells[r][c];
      if(!cell.walkable&&rnd(100)<7){cell.terrain=theme.obstacle;cell.prop=theme.props[rnd(theme.props.length)];props.push({c,r,type:cell.prop});}
    }
    const start={c:0,r:Math.floor(MAP.rows/2)},goal={c:MAP.cols-1,r:cells.findIndex(row=>row[MAP.cols-1].walkable)};
    function findPath(from,to){
      const q=[{...from}],key=p=>p.c+","+p.r,prev=new Map([[key(from),null]]),cost=new Map([[key(from),0]]);
      while(q.length){q.sort((a,b)=>cost.get(key(a))-cost.get(key(b)));const p=q.shift();if(key(p)===key(to))break;
        for(const d of [{c:1,r:0},{c:-1,r:0},{c:0,r:1},{c:0,r:-1}]){const n={c:p.c+d.c,r:p.r+d.r};if(n.c<0||n.c>=MAP.cols||n.r<0||n.r>=MAP.rows||!cells[n.r][n.c].walkable)continue;const nk=key(n),nc=cost.get(key(p))+cells[n.r][n.c].cost;if(nc<(cost.get(nk)??Infinity)){cost.set(nk,nc);prev.set(nk,key(p));q.push(n);}}
      }
      if(!prev.has(key(to)))return[];const out=[];let k=key(to);while(k){const [c,r]=k.split(",").map(Number);out.unshift({c,r});k=prev.get(k);}return out;
    }
    const route=findPath(start,goal);
    const npcAnchor=route[Math.min(4,route.length-2)]||start,npcOptions=[{c:npcAnchor.c+1,r:npcAnchor.r},{c:npcAnchor.c-1,r:npcAnchor.r},{c:npcAnchor.c,r:npcAnchor.r+1},{c:npcAnchor.c,r:npcAnchor.r-1}];
    let npcPos=npcOptions.find(p=>p.c>=0&&p.c<MAP.cols&&p.r>=0&&p.r<MAP.rows&&!cells[p.r][p.c].walkable);
    if(!npcPos){npcPos=npcOptions.find(p=>p.c>=0&&p.c<MAP.cols&&p.r>=0&&p.r<MAP.rows);}
    if(npcPos){cells[npcPos.r][npcPos.c].walkable=true;cells[npcPos.r][npcPos.c].terrain=theme.alt;cells[npcPos.r][npcPos.c].prop=null;for(let i=props.length-1;i>=0;i--)if(props[i].c===npcPos.c&&props[i].r===npcPos.r)props.splice(i,1);}
    const updatedRoute=findPath(start,goal);
    const materials=region==="FOREST"?["wood","wood","bitter_herb","bitter_herb","meat","creep_slime"]:region==="RUINS"?["iron_ore","iron_ore","ember_shard","scrap","bitter_herb","ancient_coin"]:["iron_ore","bitter_herb","meat","creep_slime","wood","desert_sage"];
    // Scatter a fresh, biome-specific set of harvestable drops through both the main route
    // and its open side clearings. Sampling without replacement prevents stacked drops.
    const dropCells=[];for(let r=0;r<MAP.rows;r++)for(let c=0;c<MAP.cols;c++)if(cells[r][c].walkable&&!(c===start.c&&r===start.r)&&!(c===goal.c&&r===goal.r)&&!(npcPos&&c===npcPos.c&&r===npcPos.r))dropCells.push({c,r});
    const caches=[],dropCount=9+rnd(7);for(let i=0;i<dropCount&&dropCells.length;i++){const pick=rnd(dropCells.length),pos=dropCells.splice(pick,1)[0];const item=rnd(100)<22?"copper_cache":materials[rnd(materials.length)];cells[pos.r][pos.c].cache=item;caches.push({pos:{...pos},item});}
    return {region,seed:rs,theme,cells,start,goal,route:updatedRoute,props,caches,npc:{name:"Wayfarer",pos:npcPos||npcAnchor,talked:false},builtOptions:carved.length};
  }
  function mapViewport(){const p=state.player.pos||state.map?.start||{c:0,r:Math.floor(MAP.rows/2)};return{c:Math.max(0,Math.min(MAP.cols-MAP.viewCols,p.c-Math.floor(MAP.viewCols/2))),r:Math.max(0,Math.min(MAP.rows-MAP.viewRows,p.r-Math.floor(MAP.viewRows/2)))};}
  function cellCenter(p){const cam=mapViewport();return{x:MAP.left+(p.c-cam.c)*MAP.tile+MAP.tile/2,y:MAP.top+(p.r-cam.r)*MAP.tile+MAP.tile/2};}
  function findMapPath(from,to){
    const key=p=>p.c+","+p.r,q=[{...from}],prev=new Map([[key(from),null]]),cost=new Map([[key(from),0]]);
    while(q.length){q.sort((a,b)=>cost.get(key(a))-cost.get(key(b)));const p=q.shift();if(key(p)===key(to))break;
      for(const d of [{c:1,r:0},{c:-1,r:0},{c:0,r:1},{c:0,r:-1}]){const n={c:p.c+d.c,r:p.r+d.r};if(n.c<0||n.c>=MAP.cols||n.r<0||n.r>=MAP.rows||!state.map.cells[n.r][n.c].walkable)continue;const nk=key(n),nc=cost.get(key(p))+state.map.cells[n.r][n.c].cost;if(nc<(cost.get(nk)??Infinity)){cost.set(nk,nc);prev.set(nk,key(p));q.push(n);}}
    }
    if(!prev.has(key(to)))return[];const path=[];let k=key(to);while(k){const [c,r]=k.split(",").map(Number);path.unshift({c,r});k=prev.get(k);}return path;
  }
  function refreshInventory(){
    const p=state.player;p.inventory=[...(p.ownedItems||[]).map(id=>itemDefs[id]?.name||id),...state.builder.extras,"Health salve × "+p.potions,"Weapon poison × "+(p.poisonCharges||0),"Ember Bolt × "+(p.spells||0),"Trail stew × "+(p.food||0),"Lives × "+p.lives,"Copper × "+p.gold,...Object.entries(p.materials||{}).filter(([,n])=>n>0).map(([id,n])=>id.replaceAll("_"," ")+" × "+n)];
  }
  function buyItem(id){
    const p=state.player,d=itemDefs[id];if(!d||p.gold<d.price)return false;p.gold-=d.price;p.ownedItems.push(id);
    if(d.kind==="weapon"){p.weaponId=id;p.weaponBuffer=d.damage||0;p.weaponRange=d.range||1;if(d.buffer)p.magicBuffer=d.buffer;}if(d.kind==="armor"){p.armorId=id;p.armorBuffer=d.armor||0;}if(d.kind==="magic"){p.magicId=id;p.magicBuffer=d.buffer||0;}
    if(d.kind==="salve")p.potions++;if(d.kind==="poison")p.poisonCharges++;
    refreshInventory();say("Purchased "+d.name+" for "+d.price+" copper.");return true;
  }
  function sellItem(id){
    const p=state.player,d=itemDefs[id];if(!d||id===p.weaponId||id===p.armorId||id===p.magicId)return false;const at=p.ownedItems.indexOf(id);if(at<0)return false;p.ownedItems.splice(at,1);const value=Math.floor(d.price/2);p.gold+=value;refreshInventory();say("Sold "+d.name+" for "+value+" copper.");return true;
  }
  function craftItem(recipe){
    const p=state.player;if(!recipe||Object.entries(recipe.cost).some(([id,n])=>(p.materials[id]||0)<n))return false;
    for(const [id,n] of Object.entries(recipe.cost))p.materials[id]-=n;
    const result=recipe.result;
    if(result.weapon){p.ownedItems.push(result.weapon);const d=itemDefs[result.weapon];p.weaponId=result.weapon;p.weaponBuffer=d.damage||0;p.weaponRange=d.range||1;}
    if(result.salve)p.potions+=result.salve;if(result.poison)p.poisonCharges+=result.poison;if(result.spell)p.spells=(p.spells||0)+1;if(result.food)p.food=(p.food||0)+result.food;
    refreshInventory();say("Crafted: "+recipe.name+".");return true;
  }
  function equipItem(id){const p=state.player,d=itemDefs[id];if(!d||!p.ownedItems.includes(id))return;if(d.kind==="weapon"){p.weaponId=id;p.weaponBuffer=d.damage||0;p.weaponRange=d.range||1;if(d.buffer)p.magicBuffer=d.buffer;}if(d.kind==="armor"){p.armorId=id;p.armorBuffer=d.armor||0;}if(d.kind==="magic"){p.magicId=id;p.magicBuffer=d.buffer||0;}refreshInventory();}
  const classes=[{name:"ROGUE",stat:"dex",role:"Shadow · precision"},{name:"WARRIOR",stat:"str",role:"Steel · endurance"},{name:"MAGE",stat:"int",role:"Arcana · control"},{name:"RANGER",stat:"wis",role:"Trail · perception"}];
  const birthsigns=["DAWN","HEARTH","VEIL","FORGE"];
  const specialties=["Stealth","Lockpicking","Athletics","Arcana","Perception"];
  const extras=["Healing Draught","Smoke Bomb","Lucky Token","Torch"];
  const itemDefs={
    iron_dagger:{name:"Iron Dagger",kind:"weapon",damage:0,price:18},ash_blade:{name:"Forged Ashblade",kind:"weapon",damage:2,price:52},
    wayfinder_staff:{name:"Wayfinder Staff",kind:"weapon",damage:0,buffer:1,price:40},recurve_bow:{name:"Recurve Bow",kind:"weapon",damage:1,range:4,price:38},
    leather_vest:{name:"Leather Vest",kind:"armor",armor:1,price:24},stoneguard:{name:"Stoneguard Coat",kind:"armor",armor:2,price:48},
    waystone_charm:{name:"Waystone Charm",kind:"magic",buffer:1,price:45},health_salve:{name:"Health Salve",kind:"salve",price:10},weapon_poison:{name:"Weapon Poison",kind:"poison",price:14}
  };
  const recipes=[
    {name:"Forge Ashblade",cost:{iron_ore:2,wood:1},result:{weapon:"ash_blade"},detail:"+2 weapon damage"},
    {name:"Brew Health Salve ×2",cost:{bitter_herb:2,creep_slime:1},result:{salve:2},detail:"Restore up to 6 HP"},
    {name:"Mix Weapon Poison ×2",cost:{bitter_herb:1,creep_slime:1},result:{poison:2},detail:"+3 damage to next hit"},
    {name:"Scribe Ember Bolt",cost:{ember_shard:2,bitter_herb:1},result:{spell:"ember_bolt"},detail:"Ranged magical attack"},
    {name:"Cook Trail Stew",cost:{meat:1,bitter_herb:1},result:{food:1},detail:"Eat to restore 5 HP"}
  ];
  const shopItems=["ash_blade","stoneguard","waystone_charm"];
  const heroInput=document.getElementById("hero-name");
  heroInput.addEventListener("input",()=>{state.builder.name=heroInput.value.trim().slice(0,18)||"Aria";syncHero();});
  function syncHero(){
    const b=state.builder,profile=classes.find(c=>c.name===b.heroClass)||classes[0],bonus={str:0,dex:0,con:0,int:0,wis:0,cha:0};bonus[profile.stat]+=2;
    if(b.birthsign==="HEARTH")bonus.cha+=2;if(b.birthsign==="VEIL")bonus.dex+=2;if(b.birthsign==="FORGE")bonus.str+=2;if(b.birthsign==="DAWN")bonus.con+=2;
    state.player.name=b.name||"Aria";state.player.class=profile.name[0]+profile.name.slice(1).toLowerCase();
    for(const k of Object.keys(b.abilities))state.player[k]=8+b.abilities[k]+bonus[k];
    state.player.hpMax=10+(b.birthsign==="DAWN"?2:0);state.player.hp=state.player.hpMax;
    state.player.ac=14+((b.birthsign==="VEIL")?1:0);state.player.potions=1+(b.extras.includes("Healing Draught")?1:0);
    state.player.specialties=[...b.specialties];state.player.luckyToken=b.extras.includes("Lucky Token");state.player.smokeBomb=b.extras.includes("Smoke Bomb");
  }
  function randInt(n){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return ((seed>>>0)%n)+1}
  function mod(score){return Math.floor((score-10)/2)}
  function say(line){state.log.push(line);if(state.log.length>5)state.log.shift()}
  function reset(){
    syncHero();seed=0x41a5e77;state.mode="playing";heroInput.style.display="none";state.phase="Pop";state.phaseIndex=0;state.phaseElapsed=0;state.pending=null;state.turn=1;
    state.map=buildMap(state.builder.region,++state.mapSerial);state.loot=[];state.npc=state.map.npc;state.npcTalked=false;
    Object.assign(state.player,{hp:state.player.hpMax,potions:1+(state.builder.extras.includes("Healing Draught")?1:0),lives:3,xp:0,score:0,defendBonus:0,alive:true,luckyUsed:false,smokeBomb:state.builder.extras.includes("Smoke Bomb"),luckyToken:state.builder.extras.includes("Lucky Token"),specialties:[...state.builder.specialties],pos:{...state.map.start}});
    const enemyName=state.builder.region==="FOREST"?"Moss Stalker":state.builder.region==="RUINS"?"Ruin Creep":"Canyon Creep";
    Object.assign(state.enemy,{name:enemyName,hp:7,hpMax:7,ac:12,alive:true,pos:{...(state.map.route[Math.min(12,state.map.route.length-2)]||state.map.goal)}});
    const starter={ROGUE:"iron_dagger",WARRIOR:"ash_blade",MAGE:"wayfinder_staff",RANGER:"recurve_bow"}[state.builder.heroClass]||"iron_dagger";
    Object.assign(state.player,{gold:0,inventory:[],ownedItems:[starter,"leather_vest"],weaponId:starter,armorId:"leather_vest",magicId:null,weaponBuffer:itemDefs[starter].damage||0,weaponRange:itemDefs[starter].range||1,armorBuffer:1,magicBuffer:itemDefs[starter].buffer||0,poisonCharges:0,poisonArmed:false,spells:0,food:0,materials:{},inventoryOpen:false,overlay:""});
    state.log=[state.player.name+" enters the "+state.builder.region.toLowerCase()+" trail.",state.enemy.name+" prowls the narrow route. Talk to the wayfarer with E."];
    state.history=[];state.lastResolution=null;state.outcome=null;refreshInventory();render();
  }
  function queueAction(action){
    if(state.mode==="builder"){return}
    if(state.mode==="over"){if(action==="attack")reset();return}
    if(state.mode!=="playing"||state.pending||state.overlay)return;
    if(action==="potion"&&state.player.potions<1){say("No health salve remains.");render();return}
    const move=action.startsWith("move:");const type=move?"move":action;
    state.pending={action:action,intent:{type:type,target:type==="talk"?state.npc?.name:state.enemy.name,direction:move?action.slice(5):null},snapshot:null,rolls:{},result:{},narrative:""};
    state.phaseIndex=0;state.phaseElapsed=0;state.phase=PHASES[0];
  }
  function phasePop(t){t.snapshot={playerHp:state.player.hp,enemyHp:state.enemy.hp,turn:state.turn};}
  function phaseWo(t){say("Aria chooses: "+t.intent.type.toUpperCase()+".");}
  function phaseYax(t){
    const d=t.rolls;
    if(t.intent.type==="attack"){
      t.result.inRange=state.enemy.alive&&Math.abs(state.player.pos.c-state.enemy.pos.c)+Math.abs(state.player.pos.r-state.enemy.pos.r)<=(state.player.weaponRange||1);
      d.attack=randInt(20);t.result.modifier=mod(state.player.dex)+(state.player.magicBuffer||0);t.result.total=d.attack+t.result.modifier;
      if(state.player.luckyToken&&!state.player.luckyUsed&&d.attack!==20&&t.result.total<state.enemy.ac){d.firstAttack=d.attack;const retry=randInt(20);if(retry>d.attack){d.attack=retry;t.result.total=retry+t.result.modifier;t.result.rerolled=true;}state.player.luckyUsed=true;}
      t.result.critical=d.attack===20;t.result.fumble=d.attack===1;t.result.hit=t.result.inRange&&!t.result.fumble&&(t.result.total>=state.enemy.ac||t.result.critical);
      if(t.result.hit){d.damage=randInt(6);t.result.damage=Math.max(1,d.damage+mod(state.player.str)+(state.player.weaponBuffer||0))*(t.result.critical?2:1)+(state.player.poisonArmed?3:0);}
    }else if(t.intent.type==="stealth"||t.intent.type==="flee"){
      d.check=randInt(20);t.result.modifier=mod(state.player.dex)+(state.player.magicBuffer||0);
      const specialty=t.intent.type==="stealth"&&state.player.specialties.includes("Stealth")?2:t.intent.type==="flee"&&state.player.specialties.includes("Athletics")?2:0;
      const smoke=t.intent.type==="stealth"&&state.player.smokeBomb?4:0;

      if(key!==mapKey){environment.clear();for(const p of game.map.props)addMapProp(p.type,p);if(game.npc)addMapProp("wayfarer",game.npc);mapKey=key;lootKey="";}
      const ox=-currentCamera.c*44,oy=currentCamera.r*44;environment.position.set(ox,oy,0);lootGroup.position.set(ox,oy,0);environment.visible=game.mode!=="builder";lootGroup.visible=game.mode!=="builder";
      const a=worldAt(game.player||{c:0,r:18}),b=worldAt(game.enemy?.pos||{c:12,r:18}),px=ox,py=oy;rogue.visible=game.mode!=="builder";goblin.visible=game.mode!=="builder"&&!!game.enemy?.alive;rogue.position.set(a.x+px,a.y+py,16);goblin.position.set(b.x+px,b.y+py,18);
      const nextLootKey=(game.loot||[]).map(item=>item.item+":"+item.pos.c+":"+item.pos.r+":"+item.amount).join("|");if(nextLootKey!==lootKey){lootGroup.clear();for(const item of game.loot||[]){const l=worldAt(item.pos),token=new THREE.Mesh(new THREE.OctahedronGeometry(7),mat(0xffd36c));token.position.set(l.x,l.y,15);token.userData.loot=true;lootGroup.add(token);}lootKey=nextLootKey;}
    }
    window.ashenThreeReady=true;window.ashenModelsStatus="ready: Three.js overhead models + terrain props";
    window.addEventListener("resize",()=>{renderer.setPixelRatio(1);renderer.setSize(1000,680,false);});
    function animate(){
      const game=window.ashenGameView?.()||{time:0};const t=game.time||0;
      syncMap(game);rogue.position.z=16+Math.sin(t*3)*.6;goblin.position.z=18+Math.sin(t*2.5+1)*.5;
      const attacking=game.action==="attack"&&(game.phase==="Sek"||game.phase==="Yax");
      rogue.rotation.z=attacking?-.5*Math.sin(t*18):Math.sin(t*1.4)*.018;
      const hit=game.action==="attack"&&game.phase==="Ch'en";
      goblin.rotation.z=hit?.25*Math.sin(t*14):Math.sin(t)*.02;
      fill.intensity=105+Math.sin(t*3)*18;goblinLight.intensity=85+Math.sin(t*2.6+1)*14;
      renderer.render(scene,camera);requestAnimationFrame(animate);
    }
    animate();
  }catch(error){
    window.ashenModelsStatus="Three.js unavailable; using built-in 2D character art";
    console.warn("Three.js models could not be loaded",error);
  }
</script>
