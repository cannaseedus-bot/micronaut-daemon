<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <radialGradient id="bg-rg" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#051420"/>
      <stop offset="100%" stop-color="#01040a"/>
    </radialGradient>
    <radialGradient id="eye-rg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22f2b3"/>
      <stop offset="60%" stop-color="#16a07a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#16a07a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-rg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hclip">
      <circle cx="100" cy="82" r="56"/>
    </clipPath>
    <style>
      .fg { animation: float 3.2s ease-in-out infinite; transform-origin: 100px 140px; }
      .el { animation: blink 5s ease-in-out infinite; transform-origin: 78px 86px; }
      .er { animation: blink 5s ease-in-out 0.5s infinite; transform-origin: 122px 86px; }
      .p1 { animation: pulse 2.2s ease-in-out infinite; }
      .p2 { animation: pulse 1.9s ease-in-out 0.6s infinite; }
      .p3 { animation: pulse 2.7s ease-in-out 1.1s infinite; }
      .sc { animation: scan 4s ease-in-out infinite; }
      .ng { animation: pulse 3s ease-in-out infinite; }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50%     { transform: translateY(-6px); }
      }
      @keyframes blink {
        0%,78%,100% { transform: scaleY(1); }
        86%         { transform: scaleY(0.07); }
      }
      @keyframes pulse {
        0%,100% { opacity: 0.55; }
        50%     { opacity: 1; }
      }
      @keyframes scan {
        0%     { transform: translateY(0);    opacity: 0.5; }
        65%    { transform: translateY(96px); opacity: 0;   }
        100%   { transform: translateY(96px); opacity: 0;   }
      }
    </style>
  </defs>

  <!-- BG -->
  <rect width="200" height="260" fill="url(#bg-rg)"/>

  <!-- Floating group -->
  <g class="fg">

    <!-- NECK -->
    <rect x="91" y="134" width="18" height="16" rx="3" fill="#020c18"/>
    <line x1="97"  y1="134" x2="97"  y2="150" stroke="#22f2b3" stroke-width="0.9" opacity="0.35"/>
    <line x1="103" y1="134" x2="103" y2="150" stroke="#22f2b3" stroke-width="0.9" opacity="0.35"/>

    <!-- BODY -->
    <rect x="54" y="150" width="92" height="66" rx="10" fill="#030e1c" stroke="#22f2b3" stroke-width="1.2"/>
    <line x1="66" y1="168" x2="134" y2="168" stroke="#22f2b3" stroke-width="0.4" opacity="0.18"/>
    <line x1="66" y1="180" x2="134" y2="180" stroke="#22f2b3" stroke-width="0.4" opacity="0.18"/>
    <line x1="66" y1="192" x2="134" y2="192" stroke="#22f2b3" stroke-width="0.4" opacity="0.18"/>
    <line x1="84"  y1="150" x2="84"  y2="216" stroke="#22f2b3" stroke-width="0.4" opacity="0.09"/>
    <line x1="116" y1="150" x2="116" y2="216" stroke="#22f2b3" stroke-width="0.4" opacity="0.09"/>

    <!-- Core ⊙ rings -->
    <circle cx="100" cy="183" r="18" fill="#010b14" stroke="#38bdf8" stroke-width="1.5" class="p2"/>
    <circle cx="100" cy="183" r="11" fill="#010b14" stroke="#22f2b3" stroke-width="0.9" opacity="0.5"/>
    <circle cx="100" cy="183" r="4.5" fill="url(#core-rg)" class="p1"/>
    <!-- Core cardinal ticks -->
    <line x1="100" y1="161" x2="100" y2="166" stroke="#38bdf8" stroke-width="1.5" class="p2"/>
    <line x1="100" y1="200" x2="100" y2="205" stroke="#38bdf8" stroke-width="1.5" class="p2"/>
    <line x1="78"  y1="183" x2="83"  y2="183" stroke="#38bdf8" stroke-width="1.5" class="p2"/>
    <line x1="117" y1="183" x2="122" y2="183" stroke="#38bdf8" stroke-width="1.5" class="p2"/>

    <!-- Shoulder caps -->
    <rect x="54"  y="150" width="14" height="6" rx="2" fill="#051a2e" stroke="#38bdf8" stroke-width="0.7" class="p3"/>
    <rect x="132" y="150" width="14" height="6" rx="2" fill="#051a2e" stroke="#38bdf8" stroke-width="0.7" class="p3"/>

    <!-- HEAD -->
    <circle cx="100" cy="82" r="56" fill="#030e1c" stroke="#22f2b3" stroke-width="1.5"/>

    <!-- Scan line (clipped to head) -->
    <rect x="44" y="28" width="112" height="2.5" rx="1" fill="#22f2b3" class="sc"
          clip-path="url(#hclip)"/>

    <!-- Ear studs -->
    <circle cx="40" cy="78" r="8"  fill="#020b16" stroke="#38bdf8" stroke-width="1.2" class="p3"/>
    <circle cx="40" cy="78" r="4"  fill="#38bdf8" class="p2"/>
    <circle cx="160" cy="78" r="8" fill="#020b16" stroke="#38bdf8" stroke-width="1.2" class="p3"/>
    <circle cx="160" cy="78" r="4" fill="#38bdf8" class="p1"/>

    <!-- Forehead glyph ⟁ -->
    <text x="100" y="56" text-anchor="middle" fill="#a855f7" font-size="14" font-weight="bold" class="p1">⟁</text>

    <!-- Eyes -->
    <g class="el">
      <ellipse cx="78" cy="86" rx="15" ry="10" fill="#010f1e" stroke="#22f2b3" stroke-width="1.5"/>
      <ellipse cx="78" cy="86" rx="9"  ry="7.5" fill="url(#eye-rg)" class="p1"/>
      <circle  cx="78" cy="86" r="3"   fill="#ffffff" opacity="0.9"/>
    </g>
    <g class="er">
      <ellipse cx="122" cy="86" rx="15" ry="10" fill="#010f1e" stroke="#22f2b3" stroke-width="1.5"/>
      <ellipse cx="122" cy="86" rx="9"  ry="7.5" fill="url(#eye-rg)" class="p2"/>
      <circle  cx="122" cy="86" r="3"   fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Mouth / data stream -->
    <rect x="68" y="108" width="64" height="10" rx="5" fill="#010b14" stroke="#22f2b3" stroke-width="1"/>
    <rect x="72"  y="110" width="7"  height="6" rx="2" fill="#22f2b3" class="p1"/>
    <rect x="83"  y="110" width="11" height="6" rx="2" fill="#38bdf8" class="p2" opacity="0.8"/>
    <rect x="98"  y="110" width="6"  height="6" rx="2" fill="#a855f7" class="p3" opacity="0.9"/>
    <rect x="108" y="110" width="9"  height="6" rx="2" fill="#22f2b3" class="p1" opacity="0.55"/>
    <rect x="121" y="110" width="7"  height="6" rx="2" fill="#38bdf8" class="p2" opacity="0.45"/>

    <!-- Orbit 1: starts right side (156,82), 5s CW -->
    <circle cx="156" cy="82" r="4" fill="#22f2b3" class="p1">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 100 82" to="360 100 82"
                        dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbit 2: starts left side (44,82), 7.5s CW opposite phase -->
    <circle cx="44" cy="82" r="3" fill="#a855f7">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 100 82" to="360 100 82"
                        dur="7.5s" repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Name label (outside float for stability) -->
  <text x="100" y="237" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace" font-size="19"
        font-weight="bold" fill="#22f2b3" letter-spacing="3" class="ng">AI-µ</text>
  <text x="100" y="252" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9"
        fill="#6b7280" letter-spacing="1" opacity="0.75">micro-scale AI</text>
</svg>
