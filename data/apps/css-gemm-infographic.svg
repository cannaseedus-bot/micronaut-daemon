<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">CSS-GEMM tensor execution path</title>
  <desc id="desc">Tensor inputs are validated, bound to WebGL2 fragment passes, read back, then CPU-authoritative gradients and AdamW update parameters.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#07111e"/></linearGradient>
    <linearGradient id="gpu" x2="1"><stop stop-color="#1c6a75"/><stop offset="1" stop-color="#123e68"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#56d9ce"/></marker>
  </defs>
  <rect width="960" height="500" rx="22" fill="url(#bg)"/>
  <text x="44" y="56" fill="#64e5d4" font-family="Segoe UI,Arial" font-size="17" font-weight="700" letter-spacing="3">CSS-C · TENSOR EXECUTION</text>
  <text x="44" y="101" fill="#f2f7ff" font-family="Segoe UI,Arial" font-size="31" font-weight="700">CSS-GEMM: graph → GPU pass → verified output</text>
  <g font-family="Segoe UI,Arial" text-anchor="middle">
    <rect x="48" y="164" width="170" height="112" rx="16" fill="#19283b" stroke="#5086b8" stroke-width="2"/>
    <text x="133" y="202" fill="#a8d8ff" font-size="14" font-weight="700">TENSOR INPUTS</text>
    <text x="133" y="237" fill="#fff" font-size="23">A × B</text>
    <text x="133" y="258" fill="#a8b8cd" font-size="12">shape + dtype</text>
    <path d="M220 220h54" stroke="#56d9ce" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="286" y="146" width="266" height="148" rx="18" fill="url(#gpu)" stroke="#59e2d2" stroke-width="2" filter="url(#glow)"/>
    <text x="419" y="184" fill="#a6fff1" font-size="14" font-weight="700">WEBGL2 · GLSL ES 3.00</text>
    <text x="419" y="222" fill="#fff" font-size="22">R32F render pass</text>
    <text x="419" y="250" fill="#c2e9f1" font-size="12">GEMM · linear · ReLU</text>
    <text x="419" y="273" fill="#c2e9f1" font-size="12">CPU fallback on unsupported ops</text>
    <path d="M555 220h55" stroke="#56d9ce" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="622" y="164" width="145" height="112" rx="16" fill="#19283b" stroke="#5086b8" stroke-width="2"/>
    <text x="694" y="202" fill="#a8d8ff" font-size="14" font-weight="700">READBACK</text>
    <text x="694" y="237" fill="#fff" font-size="21">C = A · B</text>
    <text x="694" y="258" fill="#a8b8cd" font-size="12">result + error</text>
    <path d="M770 220h55" stroke="#56d9ce" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="838" y="164" width="76" height="112" rx="16" fill="#35243b" stroke="#bd83d3" stroke-width="2"/>
    <text x="876" y="204" fill="#e4b9f4" font-size="13" font-weight="700">CPU</text>
    <text x="876" y="231" fill="#fff" font-size="13">grad</text>
    <text x="876" y="251" fill="#fff" font-size="13">AdamW</text>
  </g>
  <rect x="48" y="338" width="866" height="112" rx="16" fill="#0b1624" stroke="#263d56"/>
  <text x="76" y="374" fill="#64e5d4" font-family="Segoe UI,Arial" font-size="14" font-weight="700">AUTHORITY BOUNDARY</text>
  <text x="76" y="405" fill="#e9f1fa" font-family="Segoe UI,Arial" font-size="16">WebGL2 accelerates forward tensor operations. Backpropagation and AdamW remain CPU-authoritative.</text>
  <text x="76" y="430" fill="#9bb0c7" font-family="Segoe UI,Arial" font-size="13">Use “Open interactive CSS-GEMM demo” to probe the current browser’s WebGL2 float-render-target support.</text>
</svg>
